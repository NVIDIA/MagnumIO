name: gds-diag tests

on:
  pull_request:
    paths:
      - "gds-diag/**"
      - ".github/workflows/gds-diag-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # README documents Python 3.8+; setup-python needs an older runner image for 3.8.
          - os: ubuntu-22.04
            python-version: "3.8"
    defaults:
      run:
        working-directory: gds-diag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile check
        run: python -m py_compile gds-diag.py checks/*.py subcommands/*.py tests/*.py

      - name: Run tests
        run: python -m pytest -q tests
